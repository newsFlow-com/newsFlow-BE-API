spring:
  application:
    name: newsflow-api

  datasource:
    url: jdbc:postgresql://localhost:5433/newsflow
    username: newsflow
    password: REDACTED
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 3000ms

  elasticsearch:
    uris: ${ELASTICSEARCH_URL:http://localhost:9200}
    connection-timeout: 3s
    socket-timeout: 10s

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

server:
  port: 8080

# ── JWT ──────────────────────────────────────────────────────────
jwt:
  secret: ${JWT_SECRET:newsflow-dev-secret-key-minimum-32-chars}
  user-expiration: 86400000
  admin-expiration: 28800000

# ── 외부 서비스 ───────────────────────────────────────────────────
ai:
  server:
    url: http://localhost:8000

# ── Swagger ───────────────────────────────────────────────────────
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    groups-order: ASC
    tags-sorter: alpha
  api-docs:
    path: /api-docs
  default-consumes-media-type: application/json
  default-produces-media-type: application/json

# ── 로깅 ──────────────────────────────────────────────────────────
logging:
  level:
    com.newsflow.api: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql: TRACE

app:
  base-url: http://localhost:3000
